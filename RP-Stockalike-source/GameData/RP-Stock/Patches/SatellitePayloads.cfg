// step 2: tonnes -> units, after every other mod has finished changing part masses
@PART[*]:HAS[@RESOURCE[ComSatPayload]]:NEEDS[!RP-0,!RP-1]:FINAL
{
	@RESOURCE[ComSatPayload]
	{
		@amount *= 1000
		@maxAmount *= 1000
	}
}
