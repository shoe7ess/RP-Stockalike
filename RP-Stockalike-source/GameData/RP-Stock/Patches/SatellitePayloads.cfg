// "Real" payloads: the satellite hardware itself counts as contract payload.
// Every uncrewed probe core, antenna, solar panel, battery and science instrument carries
// payload units in proportion to its mass: 1 unit per kg (WeatherSat 1.25/kg, Sounding 2/kg,
// matching RP-0's payload densities). Units are massless and cannot be pumped between parts.
// A contract asking for 150 ComSatPayload wants about 150 kg of probe/antenna/power hardware.
// Step 1 adds the resource (amount = part mass in tonnes); step 2 converts tonnes to units.
// Only real parts with a mass key are touched: the kerbalEVA* "parts" (they carry the EVA report experiment
// and have no mass key) are skipped, which caused the "Cannot find key mass" errors.

// probe cores
@PART[*]:HAS[@MODULE[ModuleCommand],#mass,~CrewCapacity[>0],!MODULE[KerbalEVA],~name[kerbalEVA*]]:NEEDS[!RP-0,!RP-1]:LAST[RP-Stock]
{
	!RESOURCE[ComSatPayload] {}
	RESOURCE
	{
		name = ComSatPayload
		amount = #$/mass$
		maxAmount = #$/mass$
		isTweakable = false
		hideFlow = true
	}
	!RESOURCE[NavSatPayload] {}
	RESOURCE
	{
		name = NavSatPayload
		amount = #$/mass$
		maxAmount = #$/mass$
		isTweakable = false
		hideFlow = true
	}
	!RESOURCE[WeatherSatPayload] {}
	RESOURCE
	{
		name = WeatherSatPayload
		amount = #$/mass$
		maxAmount = #$/mass$
		isTweakable = false
		hideFlow = true
	}
	!RESOURCE[ResearchPayload] {}
	RESOURCE
	{
		name = ResearchPayload
		amount = #$/mass$
		maxAmount = #$/mass$
		isTweakable = false
		hideFlow = true
	}
	!RESOURCE[SoundingPayload] {}
	RESOURCE
	{
		name = SoundingPayload
		amount = #$/mass$
		maxAmount = #$/mass$
		isTweakable = false
		hideFlow = true
	}
}

