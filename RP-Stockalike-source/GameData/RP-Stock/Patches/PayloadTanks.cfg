// Lets you carry RP-0 contract payloads in a Procedural Parts liquid tank:
// in the editor, right-click the tank and switch its tank type to one of the Payload types.
// The tank is a "dummy payload": its dry mass stands in for the satellite (payload units are massless).
@PART[proceduralTankLiquid]:NEEDS[ProceduralParts,!RP-0,!RP-1]:FOR[RP-Stock]
{
	@MODULE[TankContentSwitcher]
	{
		TANK_TYPE_OPTION
		{
			name = Sounding Payload
			dryDensity = 0.5
			RESOURCE
			{
				name = SoundingPayload
				unitsPerKL = 1000
			}
		}
		TANK_TYPE_OPTION
		{
			name = Research Payload
			dryDensity = 1.0
			RESOURCE
			{
				name = ResearchPayload
				unitsPerKL = 1000
			}
		}
		TANK_TYPE_OPTION
		{
			name = ComSat Payload
			dryDensity = 0.5
			RESOURCE
			{
				name = ComSatPayload
				unitsPerKL = 1000
			}
		}
		TANK_TYPE_OPTION
		{
			name = NavSat Payload
			dryDensity = 0.5
			RESOURCE
			{
				name = NavSatPayload
				unitsPerKL = 1000
			}
		}
		TANK_TYPE_OPTION
		{
			name = WeatherSat Payload
			dryDensity = 0.8
			RESOURCE
			{
				name = WeatherSatPayload
				unitsPerKL = 1000
			}
		}
	}
}
