// RP-Stock balance: contract funds re-based on what the mission costs to fly with the installed parts (generated).
// advance = 35% of the estimated mission cost; completion = 165% (one-off contracts) or 125% (repeatable),
// so a contract returns about 2x its cost, leaving profit for facility upgrades and hiring. Failure costs the advance.
// Divisions cancel KSP's prestige factor and per-body weighting: at the 100% funds slider these are the numbers paid.

@CONTRACT_TYPE[first_FirstFlight]:FINAL { %advanceFunds = (1000) / 1 / @/targetBody.Multiplier()
	%rewardFunds = (5000) / 1 / @/targetBody.Multiplier()
	%failureFunds = (1000) / 1 / @/targetBody.Multiplier() }  // SuborbRocketDev, ~1945, sub, est. cost 3000; was 1900 / 7700
