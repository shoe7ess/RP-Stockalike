// RP-Stock calendar (Plugins/RPStock.dll): the in-game date starts at the first era.
// Stock "Year 1" is shown as startYear. With "Show as Earth time" on, dates show as a real calendar
// from 1 January of startYear (e.g. "4 Oct 1957"). Display only - the game clock, orbits and contract timers
// are unchanged. Skipped automatically if another calendar mod (e.g. Kronometer) is installed.
RPSTOCK_CALENDAR:NEEDS[!RP-0,!RP-1]
{
	startYear = 1945
}
