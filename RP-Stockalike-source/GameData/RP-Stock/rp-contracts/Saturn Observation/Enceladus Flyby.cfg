CONTRACT_TYPE:NEEDS[!RP-0,!RP-1,OPM]
{
	name = flybyEnceladus
	title = Hale Flyby
	group = SaturnObservation
	agent = Federation Aeronautique Internationale
	description = <b>Program: Sarnus Observation</b><br><br>Create a probe and send it to flyby Hale within 12 km. Make sure to transmit science from the flyby.
	synopsis = Flyby Hale closer than 12 km and transmit science
	completedMessage = Congratulations on the flyby! The data is coming in now.
	sortKey = 815
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	targetBody = Hale
	prestige = Significant
	advanceFunds = (30000) / @/targetBody.Multiplier()
	rewardScience = (45) / @/targetBody.Multiplier()
	rewardFunds = (120000) / @/targetBody.Multiplier()
	failureFunds = (30000) / @/targetBody.Multiplier()
	rewardReputation = (400) / @/targetBody.Multiplier()
	failureReputation = 0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyMars
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyVenus
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitMars
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitVenus
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Flyby Hale
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyPlanet
			type = ReachState
			maxAltitude = 11900
			disableOnStateChange = true
			title = Flyby Hale within 12 km
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectSpaceScience
			type = CollectScience
			recoveryMethod = Transmit
			title = Transmit science data from space near @targetBody
			hideChildren = true
		}
	}
}

