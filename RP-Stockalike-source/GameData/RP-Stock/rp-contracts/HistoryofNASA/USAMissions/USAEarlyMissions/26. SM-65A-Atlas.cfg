	title = 32 SM-65A-Atlas
	description = The Convair SM-65A Atlas, or Atlas A was the first full-scale prototype of the Atlas missile, which first flew on 11 June 1957. Unlike later versions of the Atlas missile, the Atlas A Did Not feature the stage and a half design. Instead, the booster engines were fixed in place, and the sustainer engine was omitted. The propulsion system used on the initial Atlas As was an early version of the Rocketdyne MA-1 engines with conical thrust chambers that produced a mere 135,000 pounds of thrust, compared with the 360,000 pounds of the fully operational Atlas D. Several pieces of hardware found on the operational Atlas were either missing on the A-series or only partially implemented. Powered flight on the A-series would last about two minutes. The first successful Atlas A flight was on 17 December 1957 at Cape Canaveral Launch Complex LC-14. Atlas A testing was completed in June 1958.
	notes = Launch the SM-65A-Atlas full scale prototype (2 boosters and no sustainer) on a sub-orbital trajectory and recover the dummy warhead intact to be studied.
	synopsis = <color=yellow>The SM-65A Atlas was first launched on June 11, 1957 from the Cape Canaveral Launch Complex.</color>
