	description = Nike-Hercules was an American two stage surface-to-air missile that replaced the Nike-Ajax and was operational with the US and NATO allied armies. The much larger missile was boosted by four Nike Ajax boosters strapped together into a first stage called a Hercules Booster, and a TX-30 Draco second stage. A large dart like solid-propellant second stage based on the TX-30 Draco replaced the dangerous and troublesome liquid-propellant second stage of the Nike-Ajax. Since Nike-Hercules used the same guidance and ground components, many Nike-Ajax missiles were replaced by Nike-Hercules at the existing sites in 1958-1963. Nike-Hercules were normally fitted with a blast-fragmentation warhead, but some received a small yield nuclear warheads. These had capability against not only high-altitude bomber formations but also tactical rockets and surface targets.&br;&br;The first stage Hercules M42 engine produced 772.0 kN of thrust for 3.40 seconds, and the second stage TX-30 Draco produced 44.50 kN of thrust for 29 seconds.  Nike-Hercules had a height of 11.90 m, a diameter of 1.06 m, a mass of 4,900 kg, and could reach a max altitude of 31 km.
	notes = Launch the Nike-Hercules SAM to 28 km altitude.
