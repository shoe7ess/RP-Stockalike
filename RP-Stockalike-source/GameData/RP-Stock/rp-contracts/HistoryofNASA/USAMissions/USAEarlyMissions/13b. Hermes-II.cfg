	title = 20 Project Hermes II
	description = Von Braun's team at White Sands made testing of a ramjet-powered missile one of their earliest priorities. The Hermes B, already proposed by Hermes contractor in 1946, was a conventional cruise missile with a conical shock body inlet ramjet. The Germans wished to pursue the Hermes II, a more radical linear ramjet concept.&br;&br;Hermes II differed from Hermes B in that its engines were unique propulsive ducts built directly into short rectangular wings of an upper cruise stage that would be lofted by a V-2 booster with enlarged tail fins.&br;&br;The second cruise stage, known as the "Ram," was built into a V-2's warhead & guidance section with an extended tail cone that nested in a recess built into top of the V-2 booster. The Ram vehicle was 18 ft (5.4 m) long and 50 in (1.25 m) in diameter. The Ram's wings had a trilateral profile and spanned  15 ft (4.5 m). The ramjets inside the wings had a "sharkmouth" inlet profile along the surface of the wings and rectangular exhausts exiting the back of the wings. The Ram's control surfaces consisted of smaller canard elevators near the nose, spanning 50 in (1.25 m), and a rudder with a height of 59 in (1.5 m).&br;&br;The V-2 was designed to boost up to 50,000 ft (15,000 m) and decouple the Ram which would coast to 66,000 ft (20,000 m) and then ignite and the stage would cruise at over 2175 mph (3500 kph).&br;&br;In 1952 is was envisioned that improved Hermes II missiles would travel at Mach 4.5 at 17 km altitude over a 250 km range. However, the decision was taken that the US Air Force would be solely responsible for long-range cruise missiles and the Hermes II was cancelled in September 1953.
	notes = Launch the Hermes II missile over 35 km in altitude and then test the ramjet cruise stage by reaching 300 klm downrange.
	synopsis = <color=yellow>On November 9, 1950, Missile 2-A was the final launch of a V-2 with the Ramjet cruise stage. It managed to stay together until staging but the ramjet never started.</color>
