	description = Development began in 1947 of the Hermes A-3, a liquid-propellant surface-to-surface missle with the abilities to toss a payload of 1,000 lbs to a range of 150 miles. The performance was similar to the German V-2, but the accuracy was much better due to a decision to equip the missle with an internal navigation system. In 1951 it was decided to have a phased approach with the Hermes A-3A interim test vehicle to lead to the Hermes A-3B operational missile with nuclear capabiliies.&br;&br;However, in 1953 an amendment to the prime contract redirected Project Hermes towards research only and a year later the project was cancelled all together. Shortly afterwards von Braun's team was assigned to Project Redstone in Alabama which promised the development of a missile expected to exceed the requirements set in Project Hermes.&br;&br;The Hermes A-3B had a thrust of 100.50 kN, a height of 10.16 m, a diameter of 1.19 m, a mass of 5,370 kg, a range of 105 klm, and a max altitude of 26 km.
