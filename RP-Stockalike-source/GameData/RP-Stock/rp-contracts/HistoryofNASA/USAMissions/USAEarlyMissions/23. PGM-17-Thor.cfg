	description = Thor was the first operational ballistic missile deployed by the U.S. Air Force (USAF). Named after the Norse god of thunder, it was deployed in the United Kingdom between 1959 and September 1963 as an intermediate-range ballistic missile (IRBM) with thermonuclear warheads. Thor was 20 m in height and 2.4 m in diameter. It was later augmented in the U.S. IRBM arsenal by the Jupiter. Thor test launches were to be from LC-17 at Cape Canaveral Missile Annex with the first successful flight on 19 December 1957.&br;&br;Despite being retired from deployment as a missile a few years after deployment, the Thor rocket found widespread use as a space launch vehicle. It was the first in a large family of space launch vehicles—the Delta rockets.&br;&br;Thor had a length of 19.76m, a diameter of 2.4m, an operational range of 250 km, a payload of 1000 kg, and an apogee of 100 km.
	notes = Launch the PGM-17-Thor IRBM on a sub-orbital trajectory to 97 km altitude and have the core survive re-entry to be destroyed on contact with the surface 250 km downrange.
