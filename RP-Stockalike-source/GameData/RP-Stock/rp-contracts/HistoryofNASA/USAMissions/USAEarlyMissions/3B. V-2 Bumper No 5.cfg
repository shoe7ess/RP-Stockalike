	description = The RTV-G-4 Bumper was a sounding rocket built by the United States. A combination of the German V-2 rocket and the WAC Corporal sounding rocket, it was used to study problems pertaining to two-stage high-speed rockets. The Bumper program launched eight rockets between May 13, 1948 and July 29, 1950. The first six flights were conducted at the White Sands Missile Range; the seventh launch, Bumper 8 on July 24, 1950, was the first rocket launched from Cape Canaveral.
