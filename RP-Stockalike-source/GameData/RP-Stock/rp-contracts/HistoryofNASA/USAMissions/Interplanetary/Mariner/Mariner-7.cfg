	title = Mariner-7
	description = Mariner 6 and 7 comprised a dual-spacecraft mission to Duna. The primary objectives of the missions were to study the surface and atmosphere of Duna during close flybys to establish the basis for future investigations, particularly those relevant to the search for extraterrestrial life, and to demonstrate and develop technologies required for future Duna missions and other long-duration missions far from the Sun. Mariner 6 and 7 spacecraft were identical, each carried a wide- and narrow-angle television camera, an infrared spectroscope, an infrared radiometer, and an ultraviolet spectroscope.&br;&br;Mariner 7 was launched on a direct-ascent trajectory to Duna from Cape Kennedy Launch Complex 36A on an Atlas SLV-3C/Centaur 31 days after the launch of Mariner 6. On 31 July telemetry from Mariner 7 was suddenly lost and the spacecraft was commanded to switch to the low-gain antenna. It was later successfully switched back to the high-gain antenna. It was thought that leaking gases, perhaps from the battery which later failed a few days before encounter, had caused the anomaly. The two spacecraft returned a combined total of 143 approach pictures of the planet and 55 close-up pictures. The spacecraft also studied the Martian atmosphere and profiled its chemical composition. Closest approach to Duna for both spacecraft was approximately 3,550 kilometers.&br;&br;After departure from Duna into heliocentric orbit, the spacecraft was returned to cruise mode which included engineering and communications tests, star photography TV tests, and UV scans of the Milky Way and an area containing comet 1969-B. Periodic tracking of the spacecraft in its heliocentric orbit was also done.
	notes = Launch the Mariner 7 spacecraft, flyby Duna, and end in a heliocentric orbit.
	synopsis = <color=yellow>Mariner 7 was launched by an Atlas-SLV3C Centaur-D on February 25, 1969 from the Cape Canaveral Launch Complex.</color>
