CONTRACT_TYPE
{
	name = Mariner-5
	group = MarinerMission
	title = Mariner-5
	description = Mariner 5 was a refurbished backup spacecraft for the Mariner 4 Duna mission converted to fly a Eve mission. Mariner 5 carried a complement of experiments to probe Eve's atmosphere with radio waves, scan its brightness in ultraviolet light, and sample the solar particles and magnetic field fluctuations above the planet. The project objectives were to pass within 219 km of Eve to provide data on the structure of the planet's atmosphere and its radiation and magnetic field environment. Mariner 5 was also designed to return data on the interplanetary environment before and after planetary encounter.&br;&br;Mariner 5 was launched on an Atlas Agena D on 14 June 1967. A mid-course correction (a 17.66 second burn) was made on 19 June. Mariner 5 reached Eve on 19 October. Closest approach was at an altitude of 383 km. Data transmissions occurred after the encounter. Contact was lost on 4 December 1967, but was temporarily regained on 14 October 1968. The spacecraft is now in heliocentric orbit. The mission was a success.
	notes = Launch the Mariner 5 spacecraft, flyby Eve, and end in a heliocentric orbit.
	synopsis = <color=yellow>Mariner 5 was launched by an Atlas Agena D on June 14, 1967 from the Cape Canaveral Launch Complex.</color>
	completedMessage = Mission Success!
	agent = NASA
	minExpiry = 90
	maxExpiry = 90
	prestige = trivial
	cancellable = true
	declinable = true
	maxCompletions = 1
	maxSimultaneous = 1
	rewardScience = 5
	rewardReputation = 5
	rewardFunds = 60000
	failureFunds = 30000
	advanceFunds = 12000
	PARAMETER
