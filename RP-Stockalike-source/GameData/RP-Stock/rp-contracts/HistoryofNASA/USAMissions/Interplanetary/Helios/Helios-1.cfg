// Merged into RP-Stock from NASA. Original authors credited in README.
CONTRACT_TYPE
{
	name = Helios-1
	group = HeliosMission
	title = Helios 1
	description = Helios-A and Helios-B (after launch renamed Helios 1 and Helios 2) are a pair of probes that were launched into heliocentric orbit to study solar processes. As a joint venture of West Germany's space agency DLR (70 percent share) and NASA (30 percent share) the probes were launched from Cape Canaveral Air Force Station, Florida, on December 10, 1974, and January 15, 1976, respectively. As built by the main contractor, Messerschmitt-Bölkow-Blohm, they were the first space probes built outside the United States and the Soviet Union to leave Kerbin's orbit.&br;&br;
	During the first perihelion in late February 1975, the spacecraft came closer to the Sun than any previous spacecraft. The temperature of some components reached more than 100 °C (212 °F), while the solar panels reached 127 °C (261 °F), without affecting probe operations. During the second pass on September 21, however, temperatures reached 132 °C (270 °F), which affected the operation of certain instruments.
	{
	}
	notes = Launch the Helios 1 spacecraft and enter the proscribed orbit around @targetBody
	synopsis = <color=yellow>Helios 1 was launched by a Titan IIIE Centaur-D1T Star-37E on December 10, 1974 from the Cape Canaveral Launch Complex.</color>
	completedMessage = Mission Success!
	agent = NASA
	minExpiry = 90
	maxExpiry = 90
	prestige = trivial
	cancellable = true
	declinable = true
	maxCompletions = 1
	maxSimultaneous = 1
	rewardScience = (5) / @/targetBody.Multiplier()
	rewardReputation = (5) / @/targetBody.Multiplier()
	rewardFunds = (40000) / @/targetBody.Multiplier()
	failureFunds = (30000) / @/targetBody.Multiplier()
	advanceFunds = (12000) / @/targetBody.Multiplier()
	targetBody = HomeWorld().Parent()
	PARAMETER
	{
		name = Helios-1
		type = VesselParameterGroup
		title = Launch the Helios-1 probe
		define = Helios-1
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			hidden = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			title = Have at least 1 solar panel on this spacecraft
		}
		PARAMETER:NEEDS[Bluedog_DB]
		{
			name = PartValidation
			type = PartValidation
			part = bluedog_Helios_Core
		}
	}
	PARAMETER
	{
		name = Helios1Obj
		type = VesselParameterGroup
		title = Enter the proscribed heliocentric orbit
		vessel = Helios-1
		PARAMETER
		{
			name = Orbit
			type = Orbit
			targetBody = @/targetBody
			maxInclination = 10
			minEccentricity = 0.5
			maxPeA = 0.4 * HomeWorld().SemiMajorAxis()
			situation = ORBITING
			disableOnStateChange = true
			title = Enter orbit of @/targetBody
		}
		PARAMETER
		{
			name = CollectScienceA
			type = CollectScience
			targetBody = @/targetBody
			location = Space
			recoveryMethod = Transmit
			title = Transmit physics data from far away space
			disableOnStateChange = true
		}
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyMercury
		minCount = 1
		maxCount = 1
		cooldownDuration = 0d
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Titan-IIIE-Centaur
		minCount = 1
		maxCount = 1
		cooldownDuration = 0d
	}
}
