	description = During the Space Race, Holloman AFB was crucial for human spaceflight preparation, notably training chimpanzees like HAM for early flights via its Aerospace Medical Center, testing rocket sleds for G-force effects with figures like Col. John Stapp, and helping the neighboring White Sands Proving Ground in developing missile technology that laid the groundwork for Mercury through its pioneering aerospace research in the desert. This contract will have you ferry pilots to Hollowman Air Force Base for specialized training. Hollowman Air Force Base has been heavily and historically populated as has White Sands and Edwards AFB in the History of NASA contract pack. I suggest the Kerbal Kontract Scenery Pack for each area and the SouthernCalifornia Addon for Sol. The main purpose of this contract is to give you additional experience and funds for what will end up being another scenery flight. NASA’s DC-6 with serial number N428NA was a Douglas Liftmaster (a military version of the DC-6A) that served NASA and its predecessor, NACA, as a research and transport aircraft.
	synopsis = Use KSC Switcher to take off from Edwards for a long flight or White Sands for a short flight and fly to Hollowman AFB and land safely. Hollowman is located roughly 30 miles north of White Sands and roughly 600 miles east of Edwards AFB.
