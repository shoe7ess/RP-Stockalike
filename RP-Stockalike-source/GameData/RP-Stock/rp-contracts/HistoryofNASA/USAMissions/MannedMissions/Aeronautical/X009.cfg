	name = X009
	title = 09 Altitude Record (Bell X-2)
	group = USAaeroMission
	agent = NACA
	description = The Bell X-2, nicknamed Starbuster, was an X-plane research aircraft built to investigate flight characteristics in the Mach 2.3 range. The X-2 was a rocket-powered, swept-wing research aircraft developed jointly in 1945 by Bell Aircraft Corporation, the United States Air Force and the National Advisory Committee for Aeronautics to explore aerodynamic problems of supersonic flight and to expand the speed and altitude regimes obtained with the earlier X-1 series of research aircraft.\n\nProviding adequate stability and control for aircraft flying at high supersonic speeds was only one of the major difficulties facing flight researchers as they approached Mach 3. For, at speeds in that region, they knew they would also begin to encounter a thermal barrier, severe heating effects caused by aerodynamic friction. Constructed of stainless steel and a copper-nickel alloy, K-Monel, and powered by a liquid propellant (alcohol and oxygen) two-chamber XLR25 11 to 67 kN sea level thrust, continuously throttleable rocket engine, the swept-wing Bell X-2 was designed to probe the supersonic region.
	synopsis = Choose the Modified RB-50 as mothership with the X-2 mated underneath and take off from the Edwards AFB runway, fly up to 9,000m and turn back towards Edwards AFB and Launch the X-2 and exceed 38,000 meters in Altitude, and then land the X-2 back at Rodgers Dry Lake Bed safely near Edwards AFB. Do not land on the runway as the skids of the X-2 are not qualified to land on concrete.
