	name = X017
	title = 17 Fly-by-Wire Test Flight
	group = USAaeroMission
	agent = NASA
	description = The NASA/McDonnell Douglas YF-4E Phantom II was a crucial testbed in the early 1970s for developing the first analog fly-by-wire (FBW) system, replacing mechanical controls with electrical signals to prove its viability for fighters, a precursor to digital FBW used in later jets like the F-16. This unique aircraft, later fitted with canards for Control Configured Vehicle (CCV) research, demonstrated that a computer could control inherently unstable aircraft, paving the way for modern flight controls, with NASA's F-8 Digital Fly-By-Wire (DFBW) program launching shortly after.
	synopsis = Take off in a YF-4E Phantom II from Edwards AFB Runway. Utilize some form of automation (Autopilot, MechJeb or KOS) to fly to the waypoints marked on the map and then return to Edwards and land safely.
