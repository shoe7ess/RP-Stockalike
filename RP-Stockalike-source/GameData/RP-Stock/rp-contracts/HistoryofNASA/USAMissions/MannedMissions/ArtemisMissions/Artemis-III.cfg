	notes = Crewed Test Flight
	synopsis = First Munar Landing using the HLS
	description = Artemis III is planned to be the first American crewed munar landing since Apollo 17 in December 1972. The mission depends on a support mission to place a Starship Human Landing System HLS in a near-rectilinear halo orbit NRHO of the Mun prior to the launch of SLS/Orion. After Starship HLS reaches NRHO, SLS/Orion will send the Orion spacecraft with a crew of four to dock with HLS. Two astronauts will transfer to HLS, which will descend to the munar surface and spend about 6.5 days on the surface. The astronauts will perform at least two Extravehicular Activities EVAs on the surface before the HLS ascends to return them to a rendezvous with Orion. Orion will return the four astronauts to Kerbin.
