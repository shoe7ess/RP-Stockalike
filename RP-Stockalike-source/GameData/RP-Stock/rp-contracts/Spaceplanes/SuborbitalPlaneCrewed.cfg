CONTRACT_TYPE:NEEDS[!RP-0,!RP-1]
{
	name = CrewedSpaceplaneSuborbital
	title = Suborbital Spaceplane Flight (Crewed)
	group = EarlySpacePlanes
	description = <b>Program: Crewed Spaceplane Development</b><br><br>Crewed suborbital flights are used as a safer prelude to an orbital mission, for research, or to set non-orbital altitude records. Send any number of crew above @VesselGroup/ReachAlt/minAltitude meters and land on the runway to satisfy the requirements of this mission. Historical missions used the X-15 (1963, B-52), and SpaceShipOne (2004, White Knight).<b><color=white>NOTE: You can not select this contract and 'First Orbital Spaceplane Flight', 'X-Planes (Suborbital)', or 'Suborbital Flight (Crewed)' at the same time. If you select the other contract while this is active, this will automatically fail.</color></b>&br;&br;<b><color=yellow>NOTE: This contract requires a horizontal landing on the space center runway.</color></b>&br;&br;<b>Number of Contracts Completed: @index / @maxCompletions</b>
	genericDescription = Launch a crewed spaceplane with at least one person aboard above the required height and return safely home to a runway landing.
	synopsis = Send a crewed spaceplane on a suborbital flight
	completedMessage = Congratulations! The crew has landed safely and we put another person in space.
	sortKey = 602
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0
	targetBody = HomeWorld()
	prestige = Trivial
	advanceFunds = 19000
	rewardScience = 8
	rewardFunds = 75000
	failureFunds = 19000
	rewardReputation = 72
	failureReputation = 0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = BreakSoundBarrier
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = XPlanesSupersonicMach2
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = XPlanesStratosphericResearch
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = XPlanesHighAltitude
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = XPlanesHypersonic
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = XPlanesKarman
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_OrbitRecover
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_SpaceplaneOrbit
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = NotXPlanesSuborbital
		type = AcceptContract
		contractType = XPlanesSuborbital
		invertRequirement = True
	}
	REQUIREMENT
	{
		name = NotCapsuleSuborbital
		type = AcceptContract
		contractType = CrewedSuborbital
		invertRequirement = True
	}
	DATA
	{
		type = int
		index = $CrewedSpaceplaneSuborbital_Count + 0
	}
	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			CrewedSpaceplaneSuborbital_Count = $CrewedSpaceplaneSuborbital_Count + 1
		}
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Suborbital flight
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = OneCrew
			type = HasCrew
			minCrew = 1
			crewOnly = true
			title = Have at least 1 crewmember on board
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachAlt
			type = ReachState
			minAltitude = ((Round(Random(140000, 200000), 10000)) <= 100000 ? (Round(Random(140000, 200000), 10000)) * 0.7 : 70000 + ((Round(Random(140000, 200000), 10000)) - 100000) * 0.07827)
			disableOnStateChange = true
			title = Reach @minAltitude meters
			hideChildren = true
		}
		PARAMETER
		{
			name = HorizontalLanding
			type = ReachState
			title = Land horizontally on Kerbin
			targetBody = HomeWorld()
			situation = LANDED
			maxSpeed = 1
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
	}
}
