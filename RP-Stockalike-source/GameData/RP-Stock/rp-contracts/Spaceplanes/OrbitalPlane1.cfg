CONTRACT_TYPE:NEEDS[!RP-0,!RP-1]
{
	name = OrbitalSpaceplane1
	title = Orbital Spaceplane (One Crew)
	group = EarlySpacePlanes
	description = <b>Program: Crewed Spaceplane Development</b><br><br>Single-person orbital spaceplanes were not historically built, but a number of concepts were studied and X-20 Dyna-Soar (1966 planned, Titan III) even began construction, paving the way for later more capable vehicles. Design, build, and launch a spaceplane that remains for @/NoOfOrbits orbits and return the crew safely back to Kerbin.&br;&br;<b><color=white>NOTE: You can not select this contract and the Orbital Flight (One Crew) or Orbital Spaceplane with Maneuvers and 2+ Crew contract. If you select the other contract while this is active, this will automatically fail.</color></b>&br;&br;<b><color=yellow>NOTE: This contract requires a horizontal landing on the space center runway. Make sure to plan your orbit to allow reentry in the right place.</color></b>&br;&br;<b>Number of Contracts Completed: @index / unlimited</b>
	genericDescription = Launch a crewed spacecraft carrying one person into orbit for a routine mission for the specified duration and land safely on the runway.
	synopsis = Fly a single-person LEO Orbital mission in a spaceplane.
	completedMessage = Crew landed safely after the mission--congratulations!
	sortKey = 610
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 0
	maxSimultaneous = 1
	deadline = 0
	targetBody = HomeWorld()
	prestige = Trivial
	advanceFunds = 32000
	rewardScience = 4
	rewardFunds = 130000
	failureFunds = 32000
	rewardReputation = 180
	failureReputation = 0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = BreakSoundBarrier
	}
	REQUIREMENT
	{
		name = CompleteContract
