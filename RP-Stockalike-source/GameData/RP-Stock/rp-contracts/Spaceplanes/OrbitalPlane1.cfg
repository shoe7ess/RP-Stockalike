	{
		name = NotCapsule
		type = AcceptContract
		contractType = OrbitalFlight1
		invertRequirement = True
	}
	DATA
	{
		type = int
		NoOfOrbits = Random(1, 8) * 3
		title = How many orbits?
	}
	DATA
	{
		type = Double
		DurDouble = 5400 * @NoOfOrbits
		title = How much time in orbit?
	}
	DATA
	{
		type = Duration
		title = Duration
		Duration = @DurDouble
		title = Total Duration
	}
	DATA
	{
		type = int
		index = $OrbitalSpaceplane1_Count + 0
	}
	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_COMPLETED_SUCCESS
		{
			OrbitalSpaceplane1_Count = $OrbitalSpaceplane1_Count + 1
		}
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Crewed orbital
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = OneCrew
			type = HasCrew
			minCrew = 1
			crewOnly = true
			title = Have 1 crewmember on board
			hideChildren = true
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = ((150000 + Round(Random(0, 55000), 10000)) <= 100000 ? (150000 + Round(Random(0, 55000), 10000)) * 0.7 : 70000 + ((150000 + Round(Random(0, 55000), 10000)) - 100000) * 0.07827)
			maxApA = ((400000 + Round(Random(-100000, 200000), 1000)) <= 100000 ? (400000 + Round(Random(-100000, 200000), 1000)) * 0.7 : 70000 + ((400000 + Round(Random(-100000, 200000), 1000)) - 100000) * 0.07827)
