			targetBody = HomeWorld()
			situation = LANDED
			maxSpeed = 1
			hideChildren = true
			completeInSequence = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home safely
			hideChildren = true
			completeInSequence = true
		}
