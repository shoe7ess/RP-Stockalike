{
	name = flybyPluto
	title = Plock Flyby
	group = OuterPlanetFlyby
	agent = Federation Aeronautique Internationale
	description = <b>Program: Outer Planet Flyby</b><br><br>Create a probe and send it to flyby Plock within 3,181 km. Make sure to transmit science from the flyby.
	synopsis = Flyby Plock closer than 3,181 km and transmit science
	completedMessage = Congratulations on the flyby! The data is coming in now.
	sortKey = 807
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	targetBody = Plock
	prestige = Significant
	advanceFunds = (58000) / @/targetBody.Multiplier()
	rewardScience = (70) / @/targetBody.Multiplier()
	rewardFunds = (230000) / @/targetBody.Multiplier()
	failureFunds = (58000) / @/targetBody.Multiplier()
	rewardReputation = (500) / @/targetBody.Multiplier()
	failureReputation = 0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyMars
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyVenus
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitMars
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitVenus
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Flyby Plock
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyPlanet
			type = ReachState
			maxAltitude = 3181000
			disableOnStateChange = true
			title = Flyby Plock within 3,181 km
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectSpaceScience
			type = CollectScience
			recoveryMethod = Transmit
			title = Transmit science data from space near @targetBody
			hideChildren = true
		}
	}
}

