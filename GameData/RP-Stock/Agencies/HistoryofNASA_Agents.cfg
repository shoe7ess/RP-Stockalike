// Agents from the History of NASA contract pack
AGENT
{
	name = HistoryofNASA
	title = HistoryofNASA
	description = The History of NASA Contract Pack is a series of 243 contracts in chronological progression covering the most memorable missions in the history of the National Aeronautics and Space Administration. This Contract Pack is broken into three categories. First, the Marshall Space Flight Center, (65 Contracts)(WW2 Rockets - Atlas V), covers United States rocket testing and development in the White Sands and Atlantic missle test ranges. Second, the Manned Spacecraft Center, (125 Contracts)(Bell X1 - Artemis X), covers manned space flight programs and early NACA experimental aircraft. Lastly, the Jet Propulsion Laboratory, (53 total)(Explorer 1 - JWST), covers robotic space exploration of the solar system. This contract pack contains many revised contracts from the History of Spaceflight contract pack that involve NASA along with several additional missions to fill chronological gaps. This contract pack was made to work with RSS or the new version of RSS Reborn called Sol. I also suggest installing Bluedog Design Bureau and both the Shuttle Orbiter and Artemis Construction Kits. I have an optional Kerbal Konstruction and MapDecal Pack for Sol which will input historical representations of Edwards AFB and White Sands Missle Range locations. I will also provide instructions on how to roll back the start date on a new save to 1947 in the HistoryofNASA folder.
	logoURL = RP-Stock/HistoryofNASA/Logo/NASAWormLogo
	logoScaledURL = RP-Stock/HistoryofNASA/Logo/NASAWormLogo_Scaled
	mentality = NoRandomContractMentality
}
