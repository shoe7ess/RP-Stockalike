AGENT
{
	name = Helios
	title = The Helios Project
	description = Helios 1 and Helios 2 are a pair of probes that were launched into heliocentric orbit to study solar processes. As a joint venture between German Aerospace Center and NASA, the probes were launched from Cape Canaveral Air Force Station, Florida, on December 10, 1974, and January 15, 1976, respectively.
