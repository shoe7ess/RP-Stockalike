// RP-Stock craft compatibility: the two LRTR sounding-rocket science canisters used by the [Sol] V-2 crafts.
// Copied from LRTR v2.0.7 (pehvbot/LRTR, lrtr-sciencecanister-625-1.cfg) without LRTR's contract system
// system. They keep the SoundingPayload slot, which RP-Stock's sounding-rocket contracts use.
+PART[science_module]:NEEDS[!LRTR]:FOR[RP-Stock]
{
	@name = lrtr-sciencecanister-625-1A
	@title = Early Suborbital Science Canister
	%rescaleFactor = 0.625
	@mass = 0.10
	@TechRequired = start
	@description = Standardized science container, useful for sub-orbital flights and returning science data.
	@cost = 100
	!MODULE[ModuleScienceExperiment] {}
	RESOURCE
	{
		name = SoundingPayload
		amount = 0
		maxAmount = 400
	}
	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = False
		storageRange = 1.3
		canBeTransferredToInVessel = True
		canTransferInVessel = True
		showStatus = True
	}
}
+PART[restock-goocanister-625-1]:NEEDS[!LRTR]:FOR[RP-Stock]
{
	@name = lrtr-sciencecanister-625-1B
	@title = Early Suborbital Science Canister (ReStock)
	@mass = 0.10
	@TechRequired = start
	@description = Standardized science container, useful for sub-orbital flights and returning science data.
	@cost = 100
	!MODULE[ModuleScienceExperiment] {}
	RESOURCE
	{
		name = SoundingPayload
		amount = 0
		maxAmount = 400
	}
	MODULE
	{
		name = ModuleScienceContainer
		reviewActionName = Review Stored Data
		storeActionName = Store Experiments
		evaOnlyStorage = False
		storageRange = 1.3
		canBeTransferredToInVessel = True
		canTransferInVessel = True
		showStatus = True
	}
}
