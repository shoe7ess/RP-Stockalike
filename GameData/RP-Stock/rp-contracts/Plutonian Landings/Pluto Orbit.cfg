	synopsis = Send an uncrewed probe into orbit around Plock
	completedMessage = Congratulations! We can continue to gather data from the new satellite.
	sortKey = 1007
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	targetBody = Plock
	prestige = Significant
	advanceFunds = (300000) / @/targetBody.Multiplier()
	rewardScience = (98) / @/targetBody.Multiplier()
	rewardFunds = (1200000) / @/targetBody.Multiplier()
	failureFunds = (300000) / @/targetBody.Multiplier()
	rewardReputation = (800) / @/targetBody.Multiplier()
	failureReputation = 0
	REQUIREMENT
	{
		name = AtLeast
		type = AtLeast
		count = 4
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyJupiter
		}
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybySaturn
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyJupiter
		}
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyUranus
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyPluto
		}
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyNeptune
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyPluto
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyPluto
		}
	}
	DATA
	{
		type = double
		orbitKM = Round((@targetBody.Radius() * 2) / 1000)
		title = Get Minimum Orbit Height
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbit Plock
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			maxPeA = @targetBody.Radius() * 2
			disableOnStateChange = true
			title = Orbit Plock with a maximum periapsis of @/orbitKM km
			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 2m
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}

