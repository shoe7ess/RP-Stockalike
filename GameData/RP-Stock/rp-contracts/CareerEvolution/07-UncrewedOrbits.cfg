CONTRACT_TYPE:NEEDS[!GPP]
{
	name = OrbitDunaMoons
	group = UncrewedOrbits
	title = Orbit the Moon of @targetBody
	agent = Experimental Engineering Group
	sortKey = 103
	notes = Launch a craft to Orbit the moon of @targetBody
	synopsis = Launch a craft to Orbit the moon of @targetBody
	description = It is time for us to send a probe to orbit the moon of @targetBody.
	completedMessage = Success! Your probe orbited the moon of @targetBody and you have returned important scientific data for our bored scientists to research.
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	cancellable = true
	declinable = true
	targetBody = @CareerEvolution:Mars
	rewardScience = (2) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardReputation = (5) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardFunds = (@CareerEvolution:Kerbucks4) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	advanceFunds = (@CareerEvolution:Kerbucks4) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	prestige = Significant
	DATA
	{
		type = List<CelestialBody>
		Moons = HomeWorld().Parent().Children().ElementAt(3).Children()
		title = Find Moons
	}
	REQUIREMENT
	{
		type = Expression
		expression = @/Moons.Count() > 0
		title = There must be a Moon
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitMars
		title = Complete @contractType Contract
	}
	PARAMETER
	{
		name = OrbitMoons
		type = VesselParameterGroup
		title = Orbit the Moon of @targetBody
		define = OrbitMoons
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitPlanet
			type = Orbit
			situation = ORBITING
			minInclination = 0
			title = Orbit @targetBody
			targetBody = @targetMoon
			rewardScience = 1
			rewardReputation = 5
			rewardFunds = @CareerEvolution:Kerbucks
			ITERATOR
			{
				type = CelestialBody
				targetMoon = @/targetBody.Children()
			}
		}
	}
}
