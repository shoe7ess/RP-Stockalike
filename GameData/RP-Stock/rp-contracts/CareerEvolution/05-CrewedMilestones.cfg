CONTRACT_TYPE
{
	name = MinmusOrbit
	group = CrewedMilestones
	title = First Crewed Orbit of @targetBody
	agent = Experimental Engineering Group
	sortKey = 110
	notes = Launch a craft with at least one Crew, orbit @targetBody and return home safely
	synopsis = Launch a craft with at least one Crew, orbit @targetBody and return home safely
	description = We are so close to reaching @targetBody and putting Kerbals on the surface. Before we are willing to take that next step, we should send Kerbals to orbit @targetBody.
	completedMessage = Congratulations! Kerbals have seen the far side of @targetBody with their own eyes for the first time! There are no more incremental steps to take. It is time to put a Kerbal on @targetBody.
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	cancellable = true
	declinable = true
	targetBody = @CareerEvolution:Minmus
	rewardScience = (4) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardReputation = (15) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardFunds = (@CareerEvolution:Kerbucks4) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	advanceFunds = (@CareerEvolution:Kerbucks4) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	prestige = Exceptional
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_Docking
		title = Complete @contractType Contract
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MinmusLanding
		title = Complete @contractType Contract
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_EVA
		title = Complete @contractType Contract
	}
	REQUIREMENT
	{
		name = TwoMoons
		type = Expression
		expression = HomeWorld().Children().Count() > 1
		title = The Home World must have 2 moons
	}
	PARAMETER
	{
		name = MinmusOrbit
		type = VesselParameterGroup
		title = First Crewed Orbit of @targetBody
		define = MinmusOrbit
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a New Vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Have at least 1 crewmember on board
			hideChildren = true
		}
		PARAMETER
		{
			name = MinmusOrbit
			type = Orbit
			maxPeA = 200000
			targetBody = HomeWorld().Children().Last()
			disableOnStateChange = true
			title = Reach Orbit of @targetBody with a maximum Periapsis of 200 km
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			targetBody = HomeWorld()
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
	}
}
CONTRACT_TYPE
{
	name = MinmusLanding-Crew
	group = CrewedMilestones
	title = First Crewed Landing on @targetBody
	agent = Experimental Engineering Group
	sortKey = 112
	notes = Launch a craft with at least one Crew, land on @targetBody and return home safely
	synopsis = Launch a craft with at least one Crew, land on @targetBody and return home safely
	description = We are ready to finally put Kerbals on the surface of @targetBody! Good luck to you in your design and execution of this complex mission!
	completedMessage = Congratulations! You have done it! Some would say there is little left to explore in the solar system now that we have landed Kerbals on @targetBody, but we don't agree with them!
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	cancellable = true
	declinable = true
	targetBody = @CareerEvolution:Minmus
	rewardScience = (5) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardReputation = (50) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardFunds = (@CareerEvolution:Kerbucks5) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	advanceFunds = (@CareerEvolution:Kerbucks5) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	prestige = Exceptional
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MinmusOrbit
		title = Complete @contractType Contract
	}
	REQUIREMENT
	{
		name = TwoMoons
		type = Expression
		expression = HomeWorld().Children().Count() > 1
		title = The Home World must have 2 moons
	}
	PARAMETER
	{
		name = MinmusLanding-Crew
		type = VesselParameterGroup
		title = First @targetBody Landing
		define = MinmusLanding-Crew
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a New Vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Have at least 1 crewmember on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnMoon
			type = ReachState
			targetBody = HomeWorld().Children().Last()
			situation = LANDED
			disableOnStateChange = true
			title = Land on @targetBody
			hideChildren = true
		}
		PARAMETER
		{
			name = PlantFlagOnMoon
			type = PlantFlag
			targetBody = HomeWorld().Children().Last()
			title = Plant a flag on @targetBody! Don't forget the picture
			hideChildren = true
		}
		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			targetBody = HomeWorld()
			title = Return Home Safely
			hideChildren = true
			completeInSequence = true
		}
	}
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		targetBody = HomeWorld().Children().Last()
		recoveryMethod = RecoverOrTransmit
		title = Collect Science from the Surface of @targetBody
		hideChildren = true
	}
}
CONTRACT_TYPE
{
	name = MinmusLandingStay
	group = CrewedMilestones
	title = Landing on @targetBody with Extended Stay
	agent = Experimental Engineering Group
	sortKey = 114
	notes = Launch a craft with at least one Crew, land on @targetBody, stay for an extended time and return home safely
	synopsis = Launch a craft with at least one Crew, land on @targetBody, stay for an extended time and return home safely
	description = It is time to go back to @targetBody! This time when you bring Kerbals there, we want you to stay for a longer time so we can explore more of the area. Bring a rover along or it will take too long to get to the different areas!
	completedMessage = Mission Success! You explored different parts of @targetBody. Even now, Kerbalkind is losing interest in our trips there. What is next for us?
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	cancellable = true
	declinable = true
	targetBody = @CareerEvolution:Minmus
	rewardScience = (2) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardReputation = (10) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	rewardFunds = (@CareerEvolution:Kerbucks5) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	advanceFunds = (@CareerEvolution:Kerbucks5) * Min(@/targetBody.Multiplier(), 8) / @/targetBody.Multiplier()
	prestige = Significant
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MinmusLanding-Crew
		title = Complete @contractType Contract
	}
	PARAMETER
	{
		name = MinmusLandingStay
		type = VesselParameterGroup
		title = Extended @targetBody Landing and Stay
		define = MinmusLandingStay
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a New Vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = TwoCrew
			type = HasCrew
			minCrew = 1
			maxCrew = 99
			title = Have at least 1 crewmember on board
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnMinmus
			type = ReachState
			targetBody = HomeWorld().Children().Last()
			situation = LANDED
			disableOnStateChange = true
			title = Land on @targetBody
			hideChildren = true
		}
		PARAMETER
		{
			name = PlantFlagOnMinmus
			type = PlantFlag
			targetBody = HomeWorld().Children().Last()
			title = Plant a flag on @targetBody! Don't forget the picture
			hideChildren = true
			disableOnStateChange = true
		}
	}
	PARAMETER
	{
		name = MinmusAlpha
		type = VisitWaypoint
		index = 0
		distance = 100.0
		title = Land near or travel to Site Alpha
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	PARAMETER
	{
		name = MinmusBeta
		type = VisitWaypoint
		index = 1
		distance = 100.0
		title = Visit Site Beta
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	PARAMETER
	{
		name = MinmusCharlie
		type = VisitWaypoint
		index = 2
		distance = 100.0
		title = Visit Site Charlie
		showMessages = true
		disableOnStateChange = true
		hideChildren = true
	}
	PARAMETER
	{
		name = ReturnHome
		type = ReturnHome
		targetBody = HomeWorld()
		title = Return Home Safely
		hideChildren = true
		completeInSequence = true
	}
	PARAMETER
	{
		name = CollectScience
		type = CollectScience
		targetBody = HomeWorld().Children().Last()
		recoveryMethod = RecoverOrTransmit
		title = Collect Science from the Surface of @targetBody
		hideChildren = true
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		RANDOM_WAYPOINT
		{
			name = Site Alpha
			hidden = False
			targetBody = HomeWorld().Children().Last()
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			forceEquatorial = false
		}
		RANDOM_WAYPOINT_NEAR
		{
			name = Site Beta
			parameter = MinmusAlpha
			hidden = false
			targetBody = HomeWorld().Children().Last()
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			nearIndex = 0
			minDistance = 500.0
			maxDistance = 1000.0
		}
		RANDOM_WAYPOINT_NEAR
		{
			name = Site Charlie
			parameter = MinmusBeta
			hidden = false
			targetBody = HomeWorld().Children().Last()
			count = 1
			icon = marker
			altitude = 0.0
			waterAllowed = false
			nearIndex = 0
			minDistance = 500.0
			maxDistance = 2000.0
		}
	}
}
