CONTRACT_TYPE:NEEDS[!RP-0,!RP-1,OPM]
{
	name = probeTitan
	title = Tekto Atmospheric Probe
	group = SaturnObservation
	agent = Federation Aeronautique Internationale
	description = <b>Program: Sarnus Observation</b><br><br>Design and successfully launch an uncrewed probe that will enter into the atmosphere of Tekto and will return scientific data.
	synopsis = Send an uncrewed probe into the Tekto atmosphere and transmit science
	completedMessage = Congratulations! Our scientists have learned valuable information about the make-up of the atmosphere.
	sortKey = 1104
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	targetBody = Tekto
	prestige = Significant
	advanceFunds = (42000) / @/targetBody.Multiplier()
	rewardScience = (70) / @/targetBody.Multiplier()
	rewardFunds = (170000) / @/targetBody.Multiplier()
	failureFunds = (42000) / @/targetBody.Multiplier()
	rewardReputation = (600) / @/targetBody.Multiplier()
	failureReputation = 0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyMars
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyVenus
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitMars
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitVenus
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Atmospheric probe Tekto
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterAtmo
			type = ReachState
			situation = FLYING
			disableOnStateChange = true
			maxAltitude = 10875
			title = Enter Tekto's atmosphere below 11 km
			hideChildren = true
		}
		PARAMETER
		{
			name = AtmoScience
			type = CollectScience
			situation = FlyingHigh
			recoveryMethod = Transmit
			title = Transmit science data from Tekto's atmosphere, AFTER going below 11 km
			hideChildren = true
			completeInSequence = true
		}
	}
}

