		name = CompleteContract
		type = CompleteContract
		contractType = orbitJupiter
	}
	REQUIREMENT:NEEDS[OPM]
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyTitan
	}
	REQUIREMENT:NEEDS[!OPM]
	{
		name = CompleteContract
		type = CompleteContract
		contractType = flybyIo
	}
	REQUIREMENT
	{
		name = AtLeast
		type = AtLeast
		count = 2
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyDione
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyEnceladus
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyEnceladus
		}
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyIapetus
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyPluto
		}
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyRhea
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyEnceladus
		}
	}
	REQUIREMENT
	{
		name = Any
		type = Any
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = probeTitan
		}
		REQUIREMENT:NEEDS[OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = probeSaturn
		}
		REQUIREMENT:NEEDS[!OPM]
		{
			name = CompleteContract
			type = CompleteContract
			contractType = probeJupiter
		}
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Hale lander
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnEnceladus
			type = ReachState
			targetBody = Hale
			situation = LANDED
			disableOnStateChange = true
			title = Land on Hale
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			targetBody = Hale
			situation = SrfLanded
			recoveryMethod = Transmit
			title = Transmit science from the surface of Hale
			hideChildren = true
		}
	}
}

