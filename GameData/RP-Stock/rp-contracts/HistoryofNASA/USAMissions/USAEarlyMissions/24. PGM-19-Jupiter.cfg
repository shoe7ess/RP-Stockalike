	title = 31 PGM-19-Jupiter
	description = The Jupiter Intermediate Range Ballistic Missile (IRBM), in service from 1960 to 1963, was an important link between early, short-range rockets and later weapons that could reach any point on Kerbin. Jupiter was a close relative of the Army’s Redstone missile, and its development began in 1956 as a joint U.S. Army and U.S. Navy project. Rocket pioneer Wernher von Braun conceived the Jupiter after the Redstone proved successful, and rockets with a range over 219 km seemed possible. Soviet development of similar missiles around the same time underscored the need for Jupiter. President Dwight Eisenhower gave the IRBM high priority in weapons development, second only to the Intercontinental Ballistic Missile (ICBM).&br;&br;As Jupiter was quickly made ready, the U.S. explored basing options. The single-stage missile’s range of 250 km required bases on the periphery of the USSR. Two missile squadrons were operational in Italy by 1961, and one squadron became operational in Turkey in 1962. Due in part to the Cuban Missile Crisis of 1962, the U.S. removed its Jupiter missiles from Italy and Turkey by July 1963.&br;&br;Jupiter was a compromise between Army and Navy designs and was short and stocky for shipboard use. The Jupiter had a length of 18.3m, a diameter of 2.67m, a payload of 750 kg, an operational range of 250 km, and an apogee of 110 km.
	notes = Launch the PGM-19-Jupiter IRBM on a sub-orbital trajectory to 109 km altitude and have the core survive re-entry to be destroyed on contact with the surface over 219 km downrange.
	synopsis = <color=yellow>The PGM-19 Jupiter was first launched on March 1, 1957 from the Cape Canaveral launch site.</color>
