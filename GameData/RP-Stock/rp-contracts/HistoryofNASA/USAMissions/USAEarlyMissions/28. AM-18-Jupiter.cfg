	description = Another biological flight was launched on 28 May 1959. Aboard Jupiter AM-18 was an American-born rhesus monkey named Miss Able, and an South American squirrel monkey named Miss Baker. The monkeys rode in the nose cone of the missile to an altitude of 100 km and a distance of 250 km down the Atlantic Missile Range from Cape Canaveral. They withstood accelerations of 38 g and were weightless for about nine minutes.&br;&br;After splashdown the Jupiter nosecone carrying Able and Baker was recovered by the seagoing tug USS Kiowa. The monkeys survived the flight in good condition. Able died four days after the flight from a reaction to anesthesia while undergoing surgery to remove an infected medical electrode. Baker became the first monkey to survive the stresses of spaceflight and the related medical procedures. Baker died November 29, 1984, at the age of 27 and is buried on the grounds of the United States Space & Rocket Center in Huntsville, Alabama.
	notes = Launch the AM-18-Jupiter on a sub-orbital trajectory to 100 km altitude  and return Able and Baker safely to Kerbin.
