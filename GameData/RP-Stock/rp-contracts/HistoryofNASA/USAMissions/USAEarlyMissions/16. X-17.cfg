	title = 23 X-17
	description = As the United States Air Force begins development of long-range ICBMs they are certain they have solved every difficulty but one, the problem of re-entry. They need to know what happens when a long-range missile traveling at fourteen times the speed of sound dives from space and back into the Kerbin's atmosphere. Will it disintegrate in flame like a meteor or will it be possible to develop materials which could withstand the extreme heat? To find this critical answer the Air Force has announced a contract for the fastest instrumented vehicle of our time: the X-17.&br;&br;The X-17 design is to have a unique flight profile:&br;1. The first stage, (x1 Sergeant SRB), will carry the rocket to an average apogee of 150,000 meters.&br;2. The fins on the first stage will re-orient the vehicle nose-down as it enters the upper-atmosphere during its fall back to Kerbin.&br;3. At 30,000 meters the first stage is to separate and the second stage fire (x3 Recruit SRBs for 2 sec.); Immediately following that the second stage is to separate and the third stage fire (x1 Recruit SRB for 2 sec.).&br;&br;Despite the short bursts of these final stages tremendous speeds approaching 4,500 m/s (Mach 14) should be achieved during the re-entry process and valuable data gained.
	notes = Launch the X-17 sounding rocket on a sub-orbital trajectory using stage one only. During re-entry fire stage two and three to reach speeds exceeding 4,500 m/s.
