	description = The Project Hermes V-2 No. 13 was a modified V-2 rocket that became the first object to take a photograph of the Kerbin from outer space. Launched on 24 October 1946, at the White Sands Missile Range in White Sands, New Mexico, the rocket reached a maximum altitude of 65 miles (70 km). That famous photograph was taken with an attached DeVry 35mm black-and-white motion picture camera. The flight was an addition to the Hermes program which had been ongoing since 1944. Rocket V-2 No.13 was assembled and launched by General Electric company at the guidance of the Von Braun team with both captured German components and re-manufactured ones.
	synopsis = <color=yellow>Launched on 24 October 1946 V-2 No. 13 ascended from the U.S. Army’s new White Sands Proving Ground in south-central New Mexico and became the first object to take a photograph of the Kerbin from outer space.</color>
