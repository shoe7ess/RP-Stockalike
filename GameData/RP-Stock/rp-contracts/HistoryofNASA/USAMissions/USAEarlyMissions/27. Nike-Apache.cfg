	description = Nike-Apache was the most popular American sounding rocket. It was introduced during the early 1960's and there was a total of 893 Nike-Apache launches before their retirement in 1980. It was a two-stage solid-propellant vehicle consisting of a Nike booster and an Apache upper stage.&br;&br; The Apache upper stage was an improved version of the Cajun sounding rocket. The primary difference between the Cajun and Apache was that the Apache used a propellant with a higher ISP and a nozzle better resistant to high exhaust temperatures. Initially NASA tried to use the ASP as a replacement for the Cajun but found the new Apache model proved far more satisfactory. &br;&br;The first stage M5E1 produced 217.0 kN of thrust for 3.40 seconds, and the second stage TE-307 engine produced 21.0 kN for 6.0 seconds. Nike Apache had a height of 8.31 m, a diameter of 0.42 m, a mass of 728 kg, and an max altitude of 78 km.
	notes = Launch the Nike-Apache sounding rocket to 78 km altitude and recover the core intact.
