	description = Under Project Hermes the General Electric Corporation was given the job of analyzing the V-2 rocket from top to bottom and learning how to design and operate even more advanced rockets. The project was divided into two main programs Hermes I and II.&br;&br;The Hermes I program consisted of the A series of missiles and the scientific Bumper rocket. The Hermes A-1 missle was based on the Nazi Wasserfall SAM and originally planned for use as an anti-aircraft system, however, following the establishment of Project Nike the requirement for Project Hermes to provide a surface-to-air missle was cancelled relegating use of the Hermes A1 as a test vehicle only.&br;&br;During 1947 and 1948 component flight testing took place on V-2s, but problems with the engine delayed the launch of the first Hermes A1 until 1950. Five Hermes A1 missles were launched from White Sands in 1950-51. Three of them were successful. Hermes A-1 had a thrust of 71.0 kN, a height of 7.7 m, a diameter of 0.86 m, a mass of 3,065 kg and a max altitude of 18 km. It had a max operation range of 46 km.
