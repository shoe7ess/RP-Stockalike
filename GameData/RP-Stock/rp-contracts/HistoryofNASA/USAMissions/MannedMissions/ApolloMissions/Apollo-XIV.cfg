	description = Apollo 14 was the eighth manned mission in the United States Apollo program, and the third to land on the Mun. It was the last of the "H missions," targeted landings with two-day stays on the Mun with two munar EVAs, or moonwalks. Commander Alan Shepard, Command Module Pilot Stuart Roosa, and Munar Module Pilot Edgar Mitchell launched on their nine-day mission on January 31, 1971 at 4:04:02 pm local time after a 40-minute, 2 second delay due to launch site weather restrictions, the first such delay in the Apollo program. Shepard and Mitchell made their munar landing on February 5 in the Fra Mauro formation; this had originally been the target of the aborted Apollo 13 mission. During the two munar EVAs, 42 kilograms (93 lb) of Mun rocks were collected and several surface experiments, including seismic studies, were performed. Shepard famously hit two golf balls on the munar surface with a makeshift club he had brought from Kerbin. Shepard and Mitchell spent about 33 hours on the Mun, with about 9  hours on EVA.
