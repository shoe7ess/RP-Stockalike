	group = USAaeroMission
	agent = NASA
	description = 18 November 1966: On Flight 175 of the research program, Major William J. Pete Knight, U.S. Air Force, flew the newly-modified North American Aviation X-15A-2, 56-6671, to Mach 6.33 2171 m/s at 98,900 feet 30,245 meters. Balls 8, the NB-52B, carried 66671 to the launch point over Mud Lake, Nevada, approximately 200 miles to the north of Edwards AFB. This was the lake where 66671 was severely damaged in an emergency landing, 9 November 1962. North American modified 66671 into the X-15A-2 configuration during repairs. With the two external propellant tanks carrying additional fuel, the engine will run for an additional 60 seconds but once the tanks are jettisoned and the X-15 was free of the additional aerodynamic drag it continued to accelerate. At its highest speed, the rocket plane was travelling more than twice as fast as a high-powered rifle bullet. Its surface temperatures exceeded 1,200F. Knight landed the X-15 on Rogers Dry Lake at Edwards Air Force Base. The duration of this flight had been 8 minutes, 26.8 seconds.
	synopsis = Using the Modified X-15A-2 Aircraft 66671 mated to the Modified NB-52B-0008 Balls 8 as mothership and take off from the Edwards AFB runway, and climb between 13,000 and 14,000 meters and turn back towards Edwards AFB before Launching the X-15 and exceeding 2058 m/s in level flight for 10 seconds between 20,000m and 30,000m, and then land the X-15 back at Rodgers Dry Lake Bed safely near Edwards AFB. Since this is to be a high temperature test flight, fly no higher than 30,480 meters as denser atmosphere will result in greater aerodynamic heating of the aircraft. Do not land on the runway as the skids of the X-15 are not qualified to land on concrete. Be sure to monitor for excessive heating.
