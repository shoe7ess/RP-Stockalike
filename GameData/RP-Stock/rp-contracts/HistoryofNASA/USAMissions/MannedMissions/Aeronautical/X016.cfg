	name = X016
	title = 17 Top Speed Record (X-15A-2)
	group = USAaeroMission
	agent = NASA
	description = The speed record breaking Flight 188 used the modified model X-15A-2 and piloted by William Knight. The X-15A-2 was modified during repairs from a 1962 emergency landing and now the fuselage was lengthened for fuel, a dummy scramjet was mounted on the ventral fin for research purposes, and two external drop tanks were added. To handle the heat of atmospheric entry, the entire surface of the X-15A-2 was covered in Martin MA-25S ablative heat shield. The ablative heat shield was designed to char and slowly break away, carrying away heat in the process. After the flight, it was found that the craft had heat damage that was not economical to repair after some repairs were completed. During landing, the scramjet broke off due to heat damage. Flight 188 landed on Rogers Dry Lake in California after a flight time of 8 minutes and 17.0 seconds. After Flight 188, 11 more X-15 flights were made before the program was retired. The X-15 program data was used in the planning of future aircraft and spacecraft designs. Flight 188 held the crewed winged spaceplane speed record till it was passed by STS-1 of the Space Shuttle Columbia on April 14, 1981. Flight 188 is still a speed record for a non-orbital aircraft in the atmosphere under a powered manned flight. X-15A-2 Number 2 aircraft was taken to the National Museum of the United States Air Force in Dayton, Ohio and repainted for permanent display.
	synopsis = Using the Modified X-15A-2 Aircraft 66671 painted White in Ablative Material mated to the Modified NB-52B-0008 Balls 8 as mothership, take off from the Edwards AFB runway and climb between 13,000 and 14,000 meters then turn back towards Edwards AFB before Launching the X-15 and exceeding 2300 m/s in level flight for 10 seconds between 20,000m and 30,000m, and then land the X-15 back at Rodgers Dry Lake Bed safely near Edwards AFB. Since this is to be a high temperature test flight, fly no higher than 30,480 meters as denser atmosphere will result in greater aerodynamic heating of the aircraft. Do not land on the runway as the skids of the X-15 are not qualified to land on concrete. Be sure to monitor for excessive heating.
