CONTRACT_TYPE
{
	name = X001A
	title = 01A High Speed Airfoil Test Flight
	group = USAaeroMission
	agent = NACA
	description = P-51D Mustangs, previously used at Langley for wing-flow research, have been transferred to the NACA's High-Speed Flight Research Station at Muroc Field (soon to be Edwards AFB) with the objective of validating wind tunnel data and exploring transonic (near-Mach 1) phenomena. To accomplish this mini airfoil models with sensors and cameras have been placed on top of the wings near the gun bays. Equipment to record the telemetry has been installed behind the pilot where the original fuselage tank has been removed. (Records show that the P-51 with serial number 44-84900 was also used as a chase and support aircraft and Neil Armstrong was among the pilots who used it to support early X-plane flights.)
	synopsis = Tests are to start above 10,000 meters. The P-51 should be put into a 25-30 degree dive to achieve a max Mach of .7 which is enough to make the airflow over the wing reach supersonic speeds. Data from these tests are going to help dictate the designs of the next generation of experimental aircraft.
