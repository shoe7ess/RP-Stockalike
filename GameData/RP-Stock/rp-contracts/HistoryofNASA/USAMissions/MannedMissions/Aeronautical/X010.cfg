	group = USAaeroMission
	agent = NACA
	description = Two X-2 aircraft completed a total of 20 flights 27 June 1952 through 27 September 1956. Aircraft 46-674 which is represented in this chapter had a total of seven glide flights and 10 powered flights. Tragically crashed 27 September 1956 when pilot Milburn G. Mel Apt attempted a banking turn while the aircraft was still above Mach 3. As a result aircraft 46-674 experienced the same phenomenon of inertia coupling which had caused Chuck Yeager to tumble violently out of control in the X-1A.
	synopsis = Using the X-2 Aircraft 46-674 and a Modified RB-50 as mothership take off from the Edwards AFB runway, and turn back towards Edwards AFB before Launching the X-2 and exceeding 1097 m/s in level flight for 5 seconds between 20,000m and 30,000m, and then land the X-2 back at Rodgers Dry Lake Bed safely near Edwards AFB. Do not land on the runway as the skids of the X-2 are not qualified to land on concrete.
