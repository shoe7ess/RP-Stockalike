	description = On Apr. 20, 1962, Armstrong carried out the longest, and fifty-first, flight of the X-15 program after zooming up to 207,500 feet in the X-15. Well outside the atmosphere, he used the reaction control system to test maneuver.  On his return, Armstrong inadvertently pulled too high an angle of attack during pullout. The flight path took a bounce in the atmosphere, and he overshot the Edwards Air Force Base, heading south at Mach 3 and at 100,000 feet. Soon he heard the main flight control center telling him as they watched his telemetry, We show you ballooning, not turning. Hard left turn, Neil! Hard left turn! He was able to turn hack while over the Rose Bowl in Pasadena. Almost out of kinetic and potential energy, he was just barely able to reach the south end of Rogers Dry Lake at Edwards. X-15 pilots began to fly high altitude test flights without the ventral fin on Aircraft 66672.
	synopsis = Using the X-15-3 Aircraft 66672 mated to the Modified NB-52B-0008 Balls 8 as mothership and take off from the Edwards AFB runway, and climb between 13,000 and 14,000 meters and turn back towards Edwards AFB before Launching the X-15 and exceed 63,000 meters in Altitude, and then land the X-15 back at Rodgers Dry Lake Bed safely near Edwards AFB. This aircraft is being launched without the dorsel fin for a test.
