CONTRACT_TYPE
{
	name = X001
	title = 01 P-80 Test Flight
	group = USAaeroMission
	agent = NACA
	description = The P-80 Shooting Star testing program proved very dangerous and in August of 1945 top-scoring World War II ace Major Richard Bong was killed on an acceptance flight of a production P-80. After Bong's death, both the USAAF and Lockheed wanted to prove the reliability of the airplane. Robert E. Thacker from the Flight Test Division at Wright Field was ordered to select three other pilots, pick up 5 P-80s from Lockheed and fly them to Muroc Army Airbase (Soon to be Edwards AFB), and fly each airplane there for 500 hours. Thacker tapped Chuck Yeager, plus two other pilots and they put 500 hours on each airplane without further incident.
	synopsis = Take off in a YP-80A Shooting Star from Edwards AFB Runway. Fly to the waypoints marked on the map and then return to Edwards and land safely.
	completedMessage = Mission Complete
	autoAccept = false
	declinable = true
	cancellable = true
	maxCompletions = 1
	maxSimultaneous = 1
	minExpiry = 1
	maxExpiry = 1
	deadline = 70
	prestige = Trivial
	targetBody = HomeWorld()
	advanceFunds = 1500
	rewardFunds = 12000
	rewardReputation = 5.0
	rewardScience = 1.0
	failureFunds = 4000.0
	failureReputation = 5.0
