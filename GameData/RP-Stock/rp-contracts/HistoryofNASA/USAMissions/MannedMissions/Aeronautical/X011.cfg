	group = USAaeroMission
	agent = NACA
	description = The North American X-15 was designed to bridge the gap between manned flight within the atmosphere and manned flight in space. The data collected influenced the Space Shuttle and subsequent spacecraft. Like many X-series aircraft, the X-15 was designed to be carried aloft and drop launched from under the wing of a B-52 mother ship. Air Force NB-52B, The Challenger serial 52-0008, also known as Balls 8 serves as carrier plane for your X-15 flights. Release of the X-15 from NB-52B commonly took place at an altitude of 13,700 meters 45,000 feet and a speed of about 223 m/s 500 mph.&br;&br;The X-15 used the XLR-11 rocket engines for its first 29 powered flights. These early flights were crucial for testing the aircraft's systems and expanding its flight envelope before the more powerful XLR-99 engine became available. The XLR-11 was used in a dual configuration, providing a total of 16,000 pounds of thrust, which was significantly less powerful than the XLR-99 engine. The X-15, when initially flying with the XLR-11 engines, achieved a top speed of Mach 2.11. This speed was reached during the first powered flight on September 17, 1959, with Scott Crossfield piloting the aircraft.
	synopsis = Using the X-15-1 (Early) 66670 (XLR-11) mated to the Modified NB-52B-0008 Balls 8 as mothership and take off from the Edwards AFB runway, and climb between 13,000 and 14,000 meters and turn back towards Edwards AFB before Launching the X-15. Then climb between 20,000 and 30,000 meters and exceed 718 m/s in level flight for 10 seconds. Following such land the X-15 back at Rodgers Dry Lake Bed.
