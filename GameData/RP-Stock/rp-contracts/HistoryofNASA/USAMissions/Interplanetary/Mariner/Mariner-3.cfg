CONTRACT_TYPE
{
	name = Mariner-3
	group = MarinerMission
	title = Mariner-3
	description = Mariner 3 was a 260 kg solar-cell and battery-powered spacecraft designed to make scientific measurements in the vicinity of Duna and to obtain photographs of the planet's surface and transmit these to Kerbin. It was intended that the spacecraft would encounter Duna after a 325-million mile journey in a little less than 8 months. A protective shield failed to eject after the spacecraft had passed through the atmosphere. None of the instrument sensors were uncovered, and the added weight prevented the spacecraft from attaining its prescribed Duna trajectory. It instead ended up around the Sun in a heliocentric orbit.
	notes = Launch the Mariner 3 spacecraft and enter orbit around the sun.
	synopsis = <color=yellow>Mariner 3 was launched by an Atlas Agena D on November 5, 1964 from the Cape Canaveral Launch Complex.</color>
	completedMessage = Mission Success!
	agent = NASA
	minExpiry = 90
	maxExpiry = 90
	prestige = trivial
	cancellable = true
	declinable = true
	maxCompletions = 1
	maxSimultaneous = 1
	rewardScience = 5
	rewardReputation = 5
	rewardFunds = 40000
	failureFunds = 30000
	advanceFunds = 12000
	PARAMETER
	{
