// Merged into RP-Stock from NASA. Original authors credited in README.
CONTRACT_TYPE
{
	name = Viking-2
	group = VikingMission
	title = Viking 2
	description = The Viking 2 mission was part of the American Viking program to Duna, and consisted of an orbiter and a lander essentially identical to that of the Viking 1 mission.[1] The craft was launched on September 9, 1975, 20 days after Viking 1. Viking 2 was operational on Duna for 1281 sols (1316 days; 3 years, 221 days). The Viking 2 lander operated on the surface for 1316 days, or 1281 sols, and was turned off on April 12, 1980, when its batteries failed. The orbiter worked until July 25, 1978,[1] returning almost 16,000 images in 706 orbits around Duna. The Viking 2 lander touched down about 78 km west of the crater Mie in Utopia Planitia at 48.269°N 225.990°W.
	notes = Launch the Viking 2 spacecraft and achieve intact landing on solid ground on @/targetBody, transmitting data from its surface.
	synopsis = <color=yellow>Viking 2 was launched by a Titan IIIE Centaur-D1T on September 9, 1975 from Cape Canaveral LC-41.</color>
	completedMessage = Mission Success!
	agent = NASA
	minExpiry = 90
	maxExpiry = 90
	prestige = Significant
	cancellable = true
	declinable = true
	maxCompletions = 1
	maxSimultaneous = 1
	rewardScience = (5) / @/targetBody.Multiplier()
	rewardReputation = (10) / @/targetBody.Multiplier()
	rewardFunds = (40000) / @/targetBody.Multiplier()
	failureFunds = (30000) / @/targetBody.Multiplier()
	advanceFunds = (12000) / @/targetBody.Multiplier()
	targetBody = @targetBody1
	DATA
	{
		title = target
		type = CelestialBody
		targetBody1 = AllBodies().Where(cb => cb.IsPlanet() && cb.SemiMajorAxis() > HomeWorld().SemiMajorAxis() && cb.SemiMajorAxis() < (2 * HomeWorld().SemiMajorAxis())).First()
	}
	PARAMETER
	{
		name = Viking-2
		type = VesselParameterGroup
		title = Launch the Viking-2 probe
		define = Viking-2
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			hidden = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			partModule = ModuleDeployableSolarPanel
			title = Have at least 1 solar panel on this spacecraft
		}
	}
	PARAMETER
	{
		name = Viking2Obj
		type = VesselParameterGroup
		title = Leave the main craft in orbit of @/targetBody
		vessel = Viking-2
		PARAMETER
		{
			name = Orbit
			type = Orbit
			targetBody = @/targetBody
			minInclination = 0
			situation = ORBITING
			disableOnStateChange = true
			title = Enter orbit of @/targetBody
		}
		PARAMETER
		{
			name = CollectScienceA
			type = CollectScience
			targetBody = @/targetBody
			location = Space
			recoveryMethod = Transmit
			experiment = temperatureScan
			title = Transmit physics data from orbit
			disableOnStateChange = true
		}
	}
	PARAMETER
	{
		name = ReachState
		type = ReachState
		targetBody = @/targetBody
		situation = LANDED
		disableOnStateChange = true
		title = Land on solid ground in one piece
	}
	PARAMETER
	{
		name = CollectScienceB
		type = CollectScience
		targetBody = @/targetBody
		location = Surface
		recoveryMethod = Transmit
		experiment = [temperatureScan, barometerScan, atmosphereAnalysis, gravityScan, seismicScan]
		title = Transmit data and images from the surface
		disableOnStateChange = true
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitVenus
		minCount = 1
		maxCount = 1
		cooldownDuration = 0d
	}
}
