	title = Munar Orbiter-4
	description = Munar Orbiter 4 was an unmanned US spacecraft, part of the Munar Orbiter Program, designed to orbit the Mun, after the three previous orbiters had completed the required needs for Apollo mapping and site selection. It was given a more general objective, to "perform a broad systematic photographic survey of munar surface features in order to increase the scientific knowledge of their nature, origin, and processes, and to serve as a basis for selecting sites for more detailed scientific study by subsequent orbital and landing missions". It was also equipped to collect selenodetic, radiation intensity, and micrometeoroid impact data. The spacecraft was placed in a cislunar trajectory and injected into an elliptical near polar high munar orbit for data acquisition. The orbit was 2,706 by 6,111 kilometres with an inclination of 85.5 degrees and a period of 12 hours. After initial photography on May 11, 1967 problems started occurring with the camera's thermal door, which was not responding well to commands to open and close. Fear that the door could become stuck in the closed position covering the camera lenses led to a decision to leave the door open. This required extra attitude control maneuvers on each orbit to prevent light leakage into the camera which would ruin the film. &br;&br;On May 13 it was discovered that light leakage was damaging some of the film, and the door was tested and partially closed. Some fogging of the lens was then suspected due to condensation resulting from the lower temperatures. Changes in the attitude raised the temperature of the camera and generally eliminated the fogging. Continuing problems with the readout drive mechanism starting and stopping beginning on May 20 resulted in a decision to terminate the photographic portion of the mission on May 26. Despite problems with the readout drive the entire film was read and transmitted. The spacecraft acquired photographic data from May 11 to 26, 1967, and readout occurred through June 1, 1967. The orbit was then lowered to gather orbital data for the upcoming Munar Orbiter 5 mission. The resulting perilune altitude range was 63.9 to 54 km. It presumably impacted the munar surface due to the natural decay of the orbit no later than October 31, 1967, possibly between 22-30 degrees W longitude.
	notes = Launch Munar Orbiter 4 into orbit around the Mun.
	synopsis = <color=yellow>Munar Orbiter 4 was launched by an Atlas Agena D on May 4, 1967 from the Cape Canaveral Launch Complex.</color>
