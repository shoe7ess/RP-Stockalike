CONTRACT_TYPE:NEEDS[!RP-0,!RP-1]
{
	name = MoonLandingFarSide
	title = First Far Side Munar Landing (Uncrewed)
	group = UncrewedLunarSurface
	description = <b>Program: Uncrewed Munar Surface Exploration</b><br><br>Design and successfully launch a craft that can achieve a soft landing on the far side of the Mun and return science data back to Kerbin.<br><br>Munar libration already allows us to see 59% of the Mun's surface, so we want you to land within 80° of the far side.<br><br><color=white><b>After this contract has been completed, the 'Far Side Munar Landing (Uncrewed)' contract will become available.</b></color>
	genericDescription = Achieve a soft landing on the far side of the Mun and transmit science.
	synopsis = Achieve a soft landing on the far side of the Mun and transmit science
	completedMessage = Mission Success! You have safely landed on the far side of the Mun and returned valuable science data from the surface. We now know that it is possible for a crewed craft to land there safely as well.
	sortKey = 715
	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	targetBody = Mun
	prestige = Exceptional
	advanceFunds = (30000) / @/targetBody.Multiplier()
	rewardScience = (20) / @/targetBody.Multiplier()
	rewardFunds = (120000) / @/targetBody.Multiplier()
	failureFunds = (30000) / @/targetBody.Multiplier()
	rewardReputation = (250) / @/targetBody.Multiplier()
	failureReputation = 0
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = LunarFlyby
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = LunarImpactor
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = LunarOrbiter
	}
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MoonLanding
		title = Complete 'First Munar Landing (Uncrewed)' contract
	}
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = MoonLandingOptional
		invertRequirement = true
	}
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = first_MoonLandingCrewed
		invertRequirement = true
	}
	DATA
	{
		type = int
		index = 0
	}
	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		CONTRACT_OFFERED
		{
			landingMoonFarSide_Completion = ($landingMoonFarSide_Completion + 0) == 0 ? (UniversalTime() - 60 * 86400) : ($landingMoonFarSide_Completion + 0)
		}
		CONTRACT_COMPLETED_SUCCESS
		{
			landingMoonFarSide_Count = $landingMoonFarSide_Count + 1
			landingMoonFarSide_Completion = UniversalTime()
		}
	}
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Far side munar lander
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			horizontalDistance = @targetBody.Radius() / 1000 * 3.1416 / 180 * 80
			showMessages = true
			disableOnStateChange = false
			title = Location: within 80° of the far side of the Mun
		}
		PARAMETER
		{
			name = LandOnMoon
			type = ReachState
			targetBody = Mun
			situation = LANDED
			disableOnStateChange = true
			completeInSequence = true
